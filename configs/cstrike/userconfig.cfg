// XashPS5 - DualSense controls
// userconfig.cfg is executed by the engine AFTER config.cfg (autoexec.cfg runs before it)
// Steam's config.cfg starts with "unbindall", which wipes the engine's
// built-in gamepad bindings: restore them here.
// SDL button names follow the Xbox layout:
//   A_BUTTON = Cross (X)   B_BUTTON = Circle   X_BUTTON = Square   Y_BUTTON = Triangle

bind "A_BUTTON"   "+jump"        // Cross: jump
bind "B_BUTTON"   "+duck"        // Circle: crouch
bind "X_BUTTON"   "+reload"      // Square: reload
bind "Y_BUTTON"   "+use"         // Triangle: use (doors, buttons, scientists)

bind "R1_BUTTON"  "invnext"      // R1: next weapon
bind "L1_BUTTON"  "invprev"      // L1: previous weapon
bind "RTRIGGER"   "+attack"      // R2: primary fire (SDL2 reports triggers as axes)
bind "LTRIGGER"   "+attack2"     // L2: secondary fire

bind "STICK1"     "+speed"       // L3: walk/run toggle
bind "STICK2"     "impulse 100"  // R3: flashlight

bind "DPAD_UP"    "impulse 100"  // D-pad up: flashlight
bind "DPAD_DOWN"  "lastinv"      // D-pad down: last weapon
bind "DPAD_LEFT"  "invprev"
bind "DPAD_RIGHT" "invnext"

bind "START"      "cancelselect" // Options: menu / close weapon select
bind "BACK"       "+showscores"  // Create/Share
bind "TOUCHPAD"   "+showscores"  // Touchpad click

// select highlighted weapon with fire (HUD weapon menu)
hud_fastswitch "1"

// gamepad feel
joy_enable "1"
joystick "1"
// right stick: circular deadzone + response curve (precise small moves,
// fast full turns), tuned by mpereiraesaa/ps5-xash3d-halflife
joy_aim_curve "1"
joy_aim_deadzone "0.10"
joy_aim_exponent "1.6"
joy_pitch_deadzone "0"
joy_yaw_deadzone "0"
joy_pitch "105"
joy_yaw "140"

// --- performance ---
// world through VBOs: one indexed draw per texture instead of one per polygon
// (the PS5 GL driver only batches indexed GL_TRIANGLES): 30 -> 60 fps
gl_vbo "1"
// vsync on: locked 60 fps without tearing (rendering now takes ~8 ms)
gl_vsync "1"
fps_max "60"

// models through the immediate-mode path: their strips/fans are converted to
// indexed triangles the PS5 driver batches (client arrays are not batched)
r_studio_drawelements "0"

// --- Counter-Strike ---
bind "DPAD_UP"    "buy"          // D-pad up: buy menu (flashlight stays on R3)
bind "TOUCHPAD"   "+showscores"  // Touchpad click: scoreboard
